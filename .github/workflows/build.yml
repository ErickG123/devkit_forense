name: Build & Release Forensic CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.get_tag.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_BYPASS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Install Commitizen
        run: pip install commitizen

      - name: Bump Version and Generate Changelog
        if: github.event_name == 'push'
        run: |
          cz bump --yes || EXIT_CODE=$?
          if [ "$EXIT_CODE" == "21" ] || [ "$EXIT_CODE" == "3" ]; then
            echo "Nenhum commit novo ou elegivel para bump (Exit Code $EXIT_CODE). Ignorando."
            echo "BUMP_CREATED=false" >> $GITHUB_ENV
            exit 0
          elif [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "0" ]; then
            exit $EXIT_CODE
          else
            echo "BUMP_CREATED=true" >> $GITHUB_ENV
          fi

      - name: Push changes and tags
        if: github.event_name == 'push' && env.BUMP_CREATED == 'true'
        run: git push origin main --tags

      - name: Get current tag
        id: get_tag
        run: echo "new_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

  build-windows:
    needs: bump-version
    runs-on: windows-latest
    steps:
      - name: Checkout bumped code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install UPX
        run: choco install upx

      - name: Install dependencies
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build executable
        run: |
          .\venv\Scripts\activate
          pyinstaller --clean --onefile --name forensic-cli --console --exclude-module pytest --exclude-module ruff --exclude-module commitizen src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forensic-cli-exe
          path: dist/forensic-cli.exe

  deploy-pypi:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bumped code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python package
        run: python -m build --outdir dist/pypi

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
        run: twine upload --repository testpypi dist/pypi/* --verbose --skip-existing

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --repository pypi dist/pypi/* --verbose --skip-existing

  create-release:
    needs: [bump-version, build-windows, deploy-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bumped code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: forensic-cli-exe
          path: ./dist/exe

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.bump-version.outputs.new_tag }} ./dist/exe/forensic-cli.exe \
            --title "Forensic CLI ${{ needs.bump-version.outputs.new_tag }}" \
            --notes-file CHANGELOG.md

      - name: Generate index.html for GitHub Pages
        run: python docs/generate_index.py || echo "Index page ignored"

      - name: Deploy GitHub Pages (Docs + Changelog)
        uses: peaceiris/actions-gh-pages@v3.9.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
