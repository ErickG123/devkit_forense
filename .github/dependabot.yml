version: 2
updates:
  # 🐍 Backend (Python)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # 🅰️ Frontend (Angular/Node)
  - package-ecosystem: "npm"
    directory: "/forenselab-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
      
  # 🤖 GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
