name: Build & Release Forensic CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build executable
        run: |
          .\venv\Scripts\activate
          pyinstaller --onefile --name forensic-cli --console --add-data "src/network;network" --add-data "src/browser;browser" --add-data "src/email;email" --add-data "src/shared;shared" --add-data "src/api;api" src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forensic-cli-exe
          path: dist/forensic-cli.exe

  deploy-pypi:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python package
        run: python -m build --outdir dist/pypi

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
        run: twine upload --repository testpypi dist/pypi/* --verbose

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --repository pypi dist/pypi/* --verbose

  release:
    needs: [build-windows, deploy-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Install Commitizen
        run: pip install commitizen

      - name: Bump Version and Generate Changelog
        run: cz bump --yes

      - name: Push changes and tags
        run: git push origin main --tags

      - name: Get current tag
        id: get_tag
        run: echo "new_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: forensic-cli-exe
          path: ./dist/exe

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view ${{ steps.get_tag.outputs.new_tag }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release if not exists
        if: steps.check_release.outputs.exists == 'false'
        run: |
          gh release create ${{ steps.get_tag.outputs.new_tag }} ./dist/exe/forensic-cli.exe \
            --title "Forensic CLI ${{ steps.get_tag.outputs.new_tag }}" \
            --notes "Automated release from main branch merge. Commit: ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate index.html for GitHub Pages
        run: python docs/generate_index.py

      - name: Deploy GitHub Pages (Docs + Changelog)
        uses: peaceiris/actions-gh-pages@v3.9.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
