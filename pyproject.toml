[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-cli"
version = "2.0.0"
description = "DevKit Forense - CLI híbrida de alta performance (Python + Go) para perícia digital e análise de evidências"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Erick Gabriel dos Santos Alves", email = "erickgabrielalves0@gmail.com"}
]
requires-python = ">=3.11"
keywords = ["forensics", "dfir", "cli", "network", "browser", "security", "incident-response"]

# ─────────────────────────────────────────────────────────────────────────────
# Dependências Enxutas da v2.0 Híbrida
# Carga pesada (sockets, DPAPI, SQLite lock-bypass) delegada ao Go Core estático.
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
    "typer[all]>=0.16.0",
    "rich>=13.8.0",
    "pydantic>=2.10.0",
    "jinja2>=3.1.4",
    "pyvis>=0.3.2",
    "networkx>=3.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "click>=8.1.0",
    "colorama>=0.4.6",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "wheel>=0.43.0",
    "build>=1.2.0",
    "twine>=5.1.0",
]

[project.scripts]
forensic-cli = "main:app"

[project.urls]
Homepage = "https://github.com/ErickG123/devkit_forense"
Documentation = "https://erickg123.github.io/devkit_forense/"
Source = "https://github.com/ErickG123/devkit_forense"
Issues = "https://github.com/ErickG123/devkit_forense/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["network*", "browser*", "mail*", "shared*", "api*", "app*", "bin*"]

[tool.setuptools.package-data]
"*" = ["*.exe", "forense-core*", "templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.0.0"
version_files = [
    "pyproject.toml:version",
    "src/shared/__init__.py:__version__"
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
