name: Build and Deploy Angular UI

on:
  push:
    branches:
      - main
    paths:
      - 'forenselab-ui/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./forenselab-ui
        run: npm install

      - name: Build and Zip
        working-directory: ./forenselab-ui
        run: npm run build:zip

      - name: Isolate Release File
        run: |
          mkdir release_dir
          mv forenselab-ui/gh-pages.zip release_dir/

      - name: Deploy to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release_dir
          force_orphan: true
